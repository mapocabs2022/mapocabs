<!DOCTYPE html>
<!--
  mapocabs Bookings Dashboard
  Version: 2.0
  - PIN is checked by your Google Apps Script (not stored in this file)
  - Mark a ride Completed to create the customer's bill
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>mapocabs — Bookings Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --asphalt:#1C1B1A; --soft:#2A2825; --amber:#FFD23F; --amber-deep:#E8B800; --paper:#F7F4EE; --muted:#8A8377;
         --green:#1F5F4A; --line:rgba(247,244,238,0.14); --danger:#C4553D; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--asphalt); color:var(--paper); font-family:'Work Sans',sans-serif; min-height:100vh;}
  h1,h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.02em; font-weight:700;}
  a{color:var(--amber);}
  #pinGate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .pin-box{background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:32px; max-width:360px; width:100%; text-align:center;}
  .pin-box h1{font-size:24px; margin-bottom:6px;} .pin-box p{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .pin-box input{width:100%; background:var(--asphalt); border:1px solid var(--line); color:var(--paper); padding:12px; border-radius:6px;
                 font-family:'Space Mono'; font-size:16px; text-align:center; outline:none; margin-bottom:14px;}
  .pin-box input:focus{border-color:var(--amber);}
  .pin-box button{width:100%; background:var(--amber); color:var(--asphalt); border:none; border-radius:6px; padding:12px;
                  font-family:'Barlow Condensed'; font-weight:700; font-size:16px; cursor:pointer;}
  .pin-error{color:var(--danger); font-size:12.5px; margin-top:10px; font-family:'Space Mono';}

  #dashboard{display:none; padding:28px 20px 80px;}
  .wrap{max-width:1000px; margin:0 auto;}
  .dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .dash-header h1{font-size:30px;}
  .dash-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{background:transparent; border:1px solid var(--line); color:var(--paper); padding:9px 15px; border-radius:6px; font-family:'Work Sans';
       font-weight:600; font-size:13px; cursor:pointer; text-decoration:none; display:inline-block;}
  .btn:hover{border-color:var(--amber);}
  .btn-amber{background:var(--amber); color:var(--asphalt); border-color:var(--amber);} .btn-amber:hover{background:var(--amber-deep);}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  @media (max-width:640px){ .stats{grid-template-columns:1fr 1fr;} }
  .stat{background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:13px; text-align:center;}
  .stat b{display:block; font-family:'Barlow Condensed'; font-size:26px;} .stat span{font-family:'Space Mono'; font-size:10.5px; color:var(--muted); text-transform:uppercase;}
  .stat.new b{color:var(--amber);} .stat.done b{color:#58b894;}

  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{background:var(--soft); border:1px solid var(--line); color:var(--paper); padding:10px 18px; border-radius:7px;
           font-family:'Barlow Condensed'; font-weight:600; font-size:15px; cursor:pointer; text-transform:uppercase;}
  .tab-btn.active{background:var(--amber); color:var(--asphalt); border-color:var(--amber);}
  .filter-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .chip{background:var(--soft); border:1px solid var(--line); color:var(--muted); padding:7px 14px; border-radius:20px; font-family:'Space Mono'; font-size:12px; cursor:pointer;}
  .chip.active{background:var(--paper); color:var(--asphalt); border-color:var(--paper);}

  .card{background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:12px;}
  .top{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-start;}
  .name{font-family:'Barlow Condensed'; font-weight:600; font-size:20px;}
  .bid{font-family:'Space Mono'; font-size:11.5px; color:var(--amber); margin-top:2px;}
  .date{font-family:'Space Mono'; font-size:11px; color:var(--muted); margin-top:2px;}
  select{background:var(--asphalt); border:1px solid var(--line); color:var(--paper); padding:7px 10px; border-radius:6px; font-family:'Space Mono'; font-size:12px; cursor:pointer;}
  .badge-done{background:rgba(31,95,74,.25); color:#58b894; font-family:'Space Mono'; font-size:11px; padding:6px 12px; border-radius:20px;}
  .details{margin-top:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; font-size:13.5px;}
  .details label{display:block; font-family:'Space Mono'; font-size:10px; color:var(--muted); letter-spacing:.05em; margin-bottom:3px;}
  .msgline{margin-top:10px; font-size:13px; color:#D8D2C4; border-top:1px solid var(--line); padding-top:10px;}
  .actions{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
  .actions a,.actions button{text-decoration:none; padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:600; cursor:pointer; border:none; font-family:'Work Sans';}
  .a-call{background:var(--green); color:var(--paper);} .a-wa{background:var(--asphalt); border:1px solid var(--line) !important; color:var(--paper);}
  .a-done{background:var(--amber); color:var(--asphalt);} .a-bill{background:#25D366; color:#0b2a17;}
  .stars{color:var(--amber); font-size:15px;}
  .empty,.loading{color:var(--muted); font-family:'Space Mono'; font-size:13px; padding:30px 0; text-align:center;}
  .error{color:#f0a898; font-family:'Space Mono'; font-size:13px; padding:16px; background:rgba(196,85,61,.1); border-radius:8px; margin-bottom:16px;}

  .overlay{position:fixed; inset:0; background:rgba(10,9,8,.78); z-index:50; display:none; align-items:center; justify-content:center; padding:18px;}
  .overlay.open{display:flex;}
  .modal{background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:24px; max-width:440px; width:100%; max-height:92vh; overflow:auto;}
  .modal h2{font-size:22px; margin-bottom:4px;} .modal .sub{color:var(--muted); font-size:12.5px; margin-bottom:14px;}
  .modal label{display:block; font-family:'Space Mono'; font-size:10.5px; color:var(--muted); letter-spacing:.05em; margin:12px 0 5px;}
  .modal input,.modal select{width:100%; background:var(--asphalt); border:1px solid var(--line); color:var(--paper); padding:11px; border-radius:6px; font-family:'Work Sans'; font-size:14px; outline:none;}
  .modal input:focus{border-color:var(--amber);}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .total-line{display:flex; justify-content:space-between; margin-top:16px; padding:11px 13px; background:rgba(255,210,63,.1); border:1px solid var(--amber); border-radius:8px; font-family:'Barlow Condensed'; font-weight:700; font-size:20px;}
  .mbtns{display:flex; gap:8px; margin-top:16px;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:12px 20px; border-radius:8px; font-size:13.5px; z-index:60; display:none;}
</style>
</head>
<body>

<div id="pinGate">
  <div class="pin-box">
    <h1>mapocabs</h1>
    <p>Enter your dashboard PIN</p>
    <input id="pinInput" type="password" autocomplete="off" placeholder="PIN">
    <button onclick="unlock()">Unlock</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<div id="dashboard"><div class="wrap">
  <div class="dash-header">
    <h1>Bookings Dashboard</h1>
    <div class="dash-actions">
      <button class="btn" onclick="loadData()">↻ Refresh</button>
      <a class="btn" href="admin.html">Trip Manager</a>
      <a class="btn" href="crm.html">CRM</a>
      <button class="btn" onclick="lock()">Lock</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab-btn active" id="tabEnq" onclick="setTab('enquiries')">Bookings</button>
    <button class="tab-btn" id="tabFb" onclick="setTab('feedback')">Feedback</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div id="content"></div>
</div></div>

<div class="overlay" id="doneModal"><div class="modal">
  <h2>Complete ride &amp; create bill</h2>
  <div class="sub" id="doneSub"></div>
  <label>RIDE FARE (₹) — what the customer pays for the ride</label>
  <input id="mFare" type="number" min="0" oninput="calcTotal()">
  <div class="two">
    <div><label>TOLL (₹)</label><input id="mToll" type="number" min="0" oninput="calcTotal()"></div>
    <div><label>PARKING (₹)</label><input id="mParking" type="number" min="0" oninput="calcTotal()"></div>
    <div><label>DRIVER ALLOWANCE (₹)</label><input id="mDA" type="number" min="0" oninput="calcTotal()"></div>
    <div><label>EXTRA KM / HOURS (₹)</label><input id="mExtra" type="number" min="0" oninput="calcTotal()"></div>
  </div>
  <label>PAYMENT MODE</label>
  <select id="mPay"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Other</option></select>
  <div class="total-line"><span>TOTAL</span><span id="mTotal">₹0</span></div>
  <div class="mbtns">
    <button class="btn btn-amber" id="mSave" onclick="saveComplete()">Save &amp; create bill</button>
    <button class="btn" onclick="closeModal()">Cancel</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= EDIT HERE ================= */
// Same Apps Script link as index.html
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzD8p7lnvQUBbF5Yg6XBLBbueq7FcJn3QiV3joON-jsZ6BoMlkhQ0Uh9NG29rYUWmnS/exec";
// Your website address (used in the bill link you send to customers)
const SITE_URL = "https://mapocabs.com";
/* ============================================= */

let PIN = "";
let activeTab = "enquiries", activeFilter = "all";
let store = { enquiries: [], feedback: [] };
let editing = null;

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ return "₹" + Number(n || 0).toLocaleString("en-IN"); }
function fmtDT(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleString("en-IN", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
function fmtD(s){ if(!s) return ""; const d = new Date(s + "T00:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-IN", {day:"2-digit", month:"short", year:"numeric"}); }
function fmtT(t){ const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); if(!m) return t || ""; let h = +m[1]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + m[2] + " " + ap; }
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; setTimeout(() => el.style.display = "none", 3500); }
function waNumber(p){ const d = String(p || "").replace(/\D/g, ""); return d.length === 10 ? "91" + d : d; }

/* ---------- PIN ---------- */
async function unlock(){
  const pin = document.getElementById("pinInput").value;
  const err = document.getElementById("pinError");
  if(!pin){ err.textContent = "Enter your PIN."; return; }
  err.textContent = "Checking…";
  const ok = await fetchList(pin);
  if(ok){
    PIN = pin;
    try{ sessionStorage.setItem("mc_pin", pin); }catch(e){}
    document.getElementById("pinGate").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    render();
  }
}
function lock(){ try{ sessionStorage.removeItem("mc_pin"); }catch(e){} location.reload(); }
document.getElementById("pinInput").addEventListener("keyup", e => { if(e.key === "Enter") unlock(); });

async function fetchList(pin){
  const err = document.getElementById("pinError");
  try{
    const res = await fetch(WEBHOOK_URL + "?action=list&key=" + encodeURIComponent(pin));
    const json = await res.json();
    if(json.status === "unauthorized"){ err.textContent = "Incorrect PIN."; return false; }
    if(json.status !== "ok"){ err.textContent = "Dashboard isn't connected yet — update your Apps Script (see guide)."; return false; }
    store = { enquiries: json.enquiries || [], feedback: json.feedback || [] };
    err.textContent = "";
    return true;
  } catch(e){
    err.textContent = "Couldn't reach the server. Check internet, and that the Apps Script is deployed for 'Anyone'.";
    return false;
  }
}
async function loadData(){
  document.getElementById("content").innerHTML = `<div class="loading">Loading…</div>`;
  const ok = await fetchList(PIN);
  if(!ok){ document.getElementById("content").innerHTML = `<div class="error">Couldn't refresh. ${esc(document.getElementById("pinError").textContent)}</div>`; return; }
  render();
}
(async function autoUnlock(){
  let p = ""; try{ p = sessionStorage.getItem("mc_pin") || ""; }catch(e){}
  if(p){ document.getElementById("pinInput").value = p; unlock(); }
})();

/* ---------- views ---------- */
function setTab(t){ activeTab = t; activeFilter = "all"; document.getElementById("tabEnq").classList.toggle("active", t === "enquiries"); document.getElementById("tabFb").classList.toggle("active", t === "feedback"); render(); }
function setFilter(f){ activeFilter = f; render(); }

function renderStats(){
  const e = store.enquiries;
  const c = s => e.filter(x => (x.status || "New") === s).length;
  const rev = e.filter(x => x.status === "Completed").reduce((a, x) => a + (parseFloat(x.total) || 0), 0);
  document.getElementById("stats").innerHTML =
    `<div class="stat new"><b>${c("New")}</b><span>New</span></div>
     <div class="stat"><b>${c("Confirmed")}</b><span>Confirmed</span></div>
     <div class="stat done"><b>${c("Completed")}</b><span>Completed</span></div>
     <div class="stat"><b>${money(rev)}</b><span>Billed</span></div>`;
}
function renderFilters(){
  const row = document.getElementById("filterRow");
  if(activeTab !== "enquiries"){ row.innerHTML = ""; return; }
  row.innerHTML = ["all","New","Confirmed","Completed","Cancelled"].map(s => `<button class="chip ${activeFilter === s ? "active" : ""}" onclick="setFilter('${s}')">${s === "all" ? "All" : s}</button>`).join("");
}
function stars(n){ n = parseInt(n) || 0; return "★".repeat(n) + "☆".repeat(Math.max(0, 5 - n)); }

function render(){
  renderStats(); renderFilters();
  const box = document.getElementById("content");
  if(activeTab === "feedback"){
    const list = store.feedback.slice().reverse();
    box.innerHTML = list.length ? list.map(f => `
      <div class="card"><div class="top"><div><div class="name">${esc(f.name)}</div><div class="date">${esc(fmtDT(f.date))}</div></div><div class="stars">${stars(f.rating)}</div></div>
      ${f.phone ? `<div class="details"><div><label>PHONE</label>${esc(f.phone)}</div></div>` : ""}
      ${f.comment ? `<div class="msgline">${esc(f.comment)}</div>` : ""}</div>`).join("") : `<div class="empty">No feedback yet.</div>`;
    return;
  }
  let list = store.enquiries.slice().reverse();
  if(activeFilter !== "all") list = list.filter(x => (x.status || "New") === activeFilter);
  if(!list.length){ box.innerHTML = `<div class="empty">Nothing here yet.</div>`; return; }
  box.innerHTML = list.map(cardHtml).join("");
}

function cardHtml(e){
  const done = e.status === "Completed";
  const key = e.bookingId || ("row" + e.row);
  const when = e.travelDate ? `${fmtD(e.travelDate)}${e.travelTime ? ", " + fmtT(e.travelTime) : ""}` : "";
  const pickup = [e.pickupCity, e.pickupAddress].filter(Boolean).join(" — ");
  const statusUi = done
    ? `<span class="badge-done">✓ Completed · ${esc(e.invoiceNo)}</span>`
    : `<select onchange="changeStatus('${esc(key)}', this.value)">${["New","Confirmed","Cancelled"].map(s => `<option ${s === (e.status || "New") ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  return `
  <div class="card">
    <div class="top">
      <div><div class="name">${esc(e.name || "—")}</div>
        ${e.bookingId ? `<div class="bid">${esc(e.bookingId)}</div>` : `<div class="bid" style="color:var(--muted)">older booking (no ID yet)</div>`}
        <div class="date">Booked ${esc(fmtDT(e.date))}</div></div>
      ${statusUi}
    </div>
    <div class="details">
      <div><label>PHONE</label>${esc(e.phone || "—")}</div>
      <div><label>TRIP</label>${esc(e.trip || "—")}</div>
      ${pickup ? `<div><label>PICKUP</label>${esc(pickup)}</div>` : ""}
      ${e.drop ? `<div><label>DROP</label>${esc(e.drop)}</div>` : ""}
      ${e.tripType ? `<div><label>TYPE</label>${esc(e.tripType)}${e.estKm ? " · ~" + esc(e.estKm) + " km" : ""}</div>` : ""}
      ${when ? `<div><label>TRAVEL</label>${esc(when)}</div>` : ""}
      ${e.returnDate ? `<div><label>RETURN</label>${esc(fmtD(e.returnDate))}</div>` : ""}
      <div><label>CAR</label>${esc(e.car || "—")}</div>
      <div><label>${done ? "QUOTED" : "PRICE"}</label>${e.price ? money(e.price) : "—"}${e.fareType ? ` <span style="color:var(--muted);font-size:11px">(${esc(e.fareType)})</span>` : ""}</div>
      ${e.coupon ? `<div><label>COUPON</label>${esc(e.coupon)}</div>` : ""}
      ${done ? `<div><label>BILLED TOTAL</label><b>${money(e.total)}</b> · ${esc(e.paymentMode || "")}</div>` : ""}
    </div>
    ${e.message ? `<div class="msgline">${esc(e.message)}</div>` : ""}
    <div class="actions">
      ${e.phone ? `<a class="a-call" href="tel:${esc(e.phone)}">Call</a><a class="a-wa" href="https://wa.me/${esc(waNumber(e.phone))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
      ${e.status !== "Cancelled" ? `<button class="a-done" onclick="openComplete('${esc(key)}')">${done ? "Edit bill amounts" : "Mark completed"}</button>` : ""}
      ${done ? `<button class="a-bill" onclick="sendBill('${esc(key)}')">Send bill link on WhatsApp</button>` : ""}
    </div>
  </div>`;
}

function find(key){ return store.enquiries.find(e => (e.bookingId || ("row" + e.row)) === key); }

/* ---------- actions ---------- */
async function post(body){
  await fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, key: PIN }) });
}
async function changeStatus(key, status){
  const e = find(key); if(!e) return;
  e.status = status;
  await post({ action: "updateStatus", bookingId: e.bookingId, row: e.row, status });
  toast("Status saved: " + status);
  renderStats();
}

function openComplete(key){
  const e = find(key); if(!e) return; editing = e;
  document.getElementById("doneSub").textContent = `${e.name} · ${e.trip || ""}${e.bookingId ? " · " + e.bookingId : ""}`;
  document.getElementById("mFare").value = e.finalFare || e.price || "";
  document.getElementById("mToll").value = e.toll || "";
  document.getElementById("mParking").value = e.parking || "";
  document.getElementById("mDA").value = e.driverAllowance || "";
  document.getElementById("mExtra").value = e.extraCharges || "";
  document.getElementById("mPay").value = e.paymentMode || "Cash";
  calcTotal();
  document.getElementById("doneModal").classList.add("open");
}
function closeModal(){ document.getElementById("doneModal").classList.remove("open"); editing = null; }
function val(id){ return parseFloat(document.getElementById(id).value) || 0; }
function calcTotal(){ document.getElementById("mTotal").textContent = money(val("mFare") + val("mToll") + val("mParking") + val("mDA") + val("mExtra")); }

async function saveComplete(){
  if(!editing) return;
  if(val("mFare") <= 0){ alert("Please enter the ride fare."); return; }
  const ed = editing;
  const btn = document.getElementById("mSave"); btn.disabled = true; btn.textContent = "Saving…";
  await post({ action: "completeRide", bookingId: ed.bookingId, row: ed.row,
    finalFare: val("mFare"), toll: val("mToll"), parking: val("mParking"), driverAllowance: val("mDA"), extraCharges: val("mExtra"),
    paymentMode: document.getElementById("mPay").value });
  await new Promise(r => setTimeout(r, 1800));       // give Google a moment to write the row
  closeModal(); btn.disabled = false; btn.textContent = "Save & create bill";
  await fetchList(PIN); render();
  toast("Ride completed - bill created ✓");
}

function sendBill(key){
  const e = find(key); if(!e || !e.bookingId){ alert("Refresh the page first — this booking needs a Booking ID."); return; }
  const link = SITE_URL + "/bill.html?id=" + encodeURIComponent(e.bookingId);
  const msg = `Hi ${e.name || ""}, thank you for riding with mapocabs! 🚕\nYour ride ${e.bookingId} is complete (Bill ${e.invoiceNo}).\n\nDownload your bill here:\n${link}\n(Enter the mobile number you booked with to open it.)`;
  window.open("https://wa.me/" + waNumber(e.phone) + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
}
document.getElementById("doneModal").addEventListener("click", ev => { if(ev.target.id === "doneModal") closeModal(); });
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  mapocabs Bookings Dashboard
  Version: 1.0
  See CHANGELOG.md.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mapocabs — Bookings Dashboard</title>
<link rel="manifest" href="/manifest-bookings.json">
<meta name="theme-color" content="#1C1B1A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mapocabs Bookings">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt:#1C1B1A; --asphalt-soft:#2A2825; --amber:#FFD23F; --amber-deep:#E8B800;
    --paper:#F7F4EE; --muted:#8A8377; --highway-green:#1F5F4A; --line:rgba(247,244,238,0.14);
    --danger:#C4553D; --warn:#D98A2B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--asphalt); color:var(--paper); font-family:'Work Sans',sans-serif; min-height:100vh;}
  h1,h2{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:700;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:var(--amber);}

  /* PIN GATE */
  #pinGate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .pin-box{
    background:var(--asphalt-soft); border:1px solid var(--line); border-radius:12px;
    padding:32px; max-width:340px; width:100%; text-align:center;
  }
  .pin-box h1{font-size:24px; margin-bottom:6px;}
  .pin-box p{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .pin-box input{
    width:100%; background:var(--asphalt); border:1px solid var(--line); color:var(--paper);
    padding:12px; border-radius:6px; font-family:'Space Mono'; font-size:18px; text-align:center;
    letter-spacing:0.3em; outline:none; margin-bottom:14px;
  }
  .pin-box input:focus{border-color:var(--amber);}
  .pin-box button{
    width:100%; background:var(--amber); color:var(--asphalt); border:none; border-radius:6px;
    padding:12px; font-family:'Barlow Condensed'; font-weight:700; font-size:16px; cursor:pointer;
  }
  .pin-error{color:var(--danger); font-size:12.5px; margin-top:10px; font-family:'Space Mono';}

  /* DASHBOARD */
  #dashboard{display:none; padding:28px 20px 80px;}
  .wrap{max-width:1000px; margin:0 auto;}
  .dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .dash-header h1{font-size:30px;}
  .dash-actions{display:flex; gap:10px;}
  .btn{
    background:transparent; border:1px solid var(--line); color:var(--paper);
    padding:9px 16px; border-radius:6px; font-family:'Work Sans'; font-weight:600;
    font-size:13px; cursor:pointer;
  }
  .btn:hover{border-color:var(--amber);}
  .btn-amber{background:var(--amber); color:var(--asphalt); border-color:var(--amber);}
  .btn-amber:hover{background:var(--amber-deep);}

  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab-btn{
    background:var(--asphalt-soft); border:1px solid var(--line); color:var(--paper);
    padding:10px 18px; border-radius:7px; font-family:'Barlow Condensed'; font-weight:600;
    font-size:15px; cursor:pointer; text-transform:uppercase;
  }
  .tab-btn.active{background:var(--amber); color:var(--asphalt); border-color:var(--amber);}

  .filter-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filter-chip{
    background:var(--asphalt-soft); border:1px solid var(--line); color:var(--muted);
    padding:7px 14px; border-radius:20px; font-family:'Space Mono'; font-size:12px; cursor:pointer;
  }
  .filter-chip.active{background:var(--paper); color:var(--asphalt); border-color:var(--paper);}

  .booking-card{
    background:var(--asphalt-soft); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:12px;
  }
  .bc-top{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-start;}
  .bc-name{font-family:'Barlow Condensed'; font-weight:600; font-size:19px;}
  .bc-date{font-family:'Space Mono'; font-size:11px; color:var(--muted); margin-top:2px;}
  .bc-status-select{
    background:var(--asphalt); border:1px solid var(--line); color:var(--paper);
    padding:7px 10px; border-radius:6px; font-family:'Space Mono'; font-size:12px; cursor:pointer;
  }
  .status-new{color:var(--amber);}
  .status-confirmed{color:var(--highway-green);}
  .status-completed{color:var(--muted);}
  .status-cancelled{color:var(--danger);}
  .bc-details{margin-top:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; font-size:13.5px;}
  .bc-detail label{display:block; font-family:'Space Mono'; font-size:10px; color:var(--muted); letter-spacing:0.05em; margin-bottom:3px;}
  .bc-message{margin-top:10px; font-size:13.5px; color:#D8D2C4; border-top:1px solid var(--line); padding-top:10px;}
  .bc-actions{margin-top:12px; display:flex; gap:8px;}
  .bc-call{
    background:var(--highway-green); color:var(--paper); text-decoration:none;
    padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:600;
  }
  .bc-stars{color:var(--amber); font-size:15px;}
  .empty-state{color:var(--muted); font-family:'Space Mono'; font-size:13px; padding:30px 0; text-align:center;}
  .loading-state{color:var(--muted); font-family:'Space Mono'; font-size:13px; padding:30px 0; text-align:center;}
  .error-state{color:var(--danger); font-family:'Space Mono'; font-size:13px; padding:16px; background:rgba(196,85,61,0.08); border-radius:8px; margin-bottom:16px;}
</style>
</head>
<body>

<div id="pinGate">
  <div class="pin-box">
    <h1>mapocabs</h1>
    <p>Enter your access PIN to view bookings</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button onclick="checkPin()">Unlock</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <div class="dash-header">
      <h1>Bookings Dashboard</h1>
      <div class="dash-actions">
        <button class="btn" onclick="loadData()">↻ Refresh</button>
        <a class="btn" href="admin.html">Trip Manager →</a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabEnq" onclick="setTab('enquiries')">Enquiries</button>
      <button class="tab-btn" id="tabFb" onclick="setTab('feedback')">Feedback</button>
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div id="content"></div>
  </div>
</div>

<script>
// =========================================================================
// EDIT YOUR DETAILS HERE
// =========================================================================

// Change this PIN to whatever you want. This is NOT strong security —
// anyone who knows this PIN (or the Apps Script URL directly) can see
// your bookings — but it stops a casual visitor from opening this page.
const ACCESS_PIN = "2022";

// Same Google Apps Script URL as your main site (index.html).
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwnp-IN9hm5Pqz9xyT3xbye1dK9aJefzlC4FJafbn-Ka_laI3mX-3jS4enqFMrS3L5BiA/exec";

/* ================= NOTHING BELOW THIS LINE NEEDS EDITING ================= */

function checkPin(){
  const input = document.getElementById("pinInput").value.trim();
  const err = document.getElementById("pinError");
  if(input === ACCESS_PIN){
    document.getElementById("pinGate").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    loadData();
  } else {
    err.textContent = "Incorrect PIN, try again.";
  }
}
document.getElementById("pinInput").addEventListener("keyup", e => { if(e.key === "Enter") checkPin(); });

let activeTab = "enquiries";
let activeFilter = "all";
let dataStore = { enquiries: [], feedback: [] };

function setTab(tab){
  activeTab = tab;
  activeFilter = "all";
  document.getElementById("tabEnq").classList.toggle("active", tab === "enquiries");
  document.getElementById("tabFb").classList.toggle("active", tab === "feedback");
  renderFilters();
  render();
}

function renderFilters(){
  const row = document.getElementById("filterRow");
  if(activeTab !== "enquiries"){ row.innerHTML = ""; return; }
  const statuses = ["all", "New", "Confirmed", "Completed", "Cancelled"];
  row.innerHTML = statuses.map(s => `
    <button class="filter-chip ${activeFilter === s ? 'active' : ''}" onclick="setFilter('${s}')">${s === 'all' ? 'All' : s}</button>
  `).join("");
}
function setFilter(s){ activeFilter = s; renderFilters(); render(); }

async function loadData(){
  const content = document.getElementById("content");
  content.innerHTML = `<div class="loading-state">Loading bookings…</div>`;
  try{
    const res = await fetch(WEBHOOK_URL, { method: "GET" });
    const json = await res.json();
    dataStore = json;
    render();
  } catch(err){
    content.innerHTML = `<div class="error-state">Couldn't load bookings. Check WEBHOOK_URL is set correctly, and that the Apps Script is deployed with "Who has access: Anyone". Error: ${err}</div>`;
  }
}

function starString(n){
  const num = parseInt(n) || 0;
  return "★".repeat(num) + "☆".repeat(Math.max(0, 5 - num));
}

function render(){
  renderFilters();
  const content = document.getElementById("content");

  if(activeTab === "enquiries"){
    let list = dataStore.enquiries.slice().reverse(); // newest first
    if(activeFilter !== "all") list = list.filter(e => (e.status || "New") === activeFilter);

    if(list.length === 0){
      content.innerHTML = `<div class="empty-state">No enquiries here yet.</div>`;
      return;
    }

    content.innerHTML = list.map(e => `
      <div class="booking-card">
        <div class="bc-top">
          <div>
            <div class="bc-name">${escapeHtml(e.name || "—")}</div>
            <div class="bc-date">${formatDate(e.date)}</div>
          </div>
          <select class="bc-status-select status-${(e.status||'New').toLowerCase()}" onchange="updateStatus(${e.row}, this.value, this)">
            ${["New","Confirmed","Completed","Cancelled"].map(s => `<option value="${s}" ${s===(e.status||"New") ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="bc-details">
          <div class="bc-detail"><label>PHONE</label>${escapeHtml(e.phone || "—")}</div>
          <div class="bc-detail"><label>TRIP</label>${escapeHtml(e.trip || "—")}</div>
          <div class="bc-detail"><label>CAR</label>${escapeHtml(e.car || "—")}</div>
          <div class="bc-detail"><label>PRICE</label>${e.price ? "₹" + e.price : "—"}</div>
        </div>
        ${e.message ? `<div class="bc-message">${escapeHtml(e.message)}</div>` : ""}
        <div class="bc-actions">
          ${e.phone ? `<a class="bc-call" href="tel:${escapeHtml(e.phone)}">Call</a>` : ""}
          ${e.phone ? `<a class="bc-call" style="background:var(--asphalt); border:1px solid var(--line);" href="https://wa.me/${escapeHtml(String(e.phone).replace(/\\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        </div>
      </div>
    `).join("");
  } else {
    let list = dataStore.feedback.slice().reverse();
    if(list.length === 0){
      content.innerHTML = `<div class="empty-state">No feedback yet.</div>`;
      return;
    }
    content.innerHTML = list.map(f => `
      <div class="booking-card">
        <div class="bc-top">
          <div>
            <div class="bc-name">${escapeHtml(f.name || "—")}</div>
            <div class="bc-date">${formatDate(f.date)}</div>
          </div>
          <div class="bc-stars">${starString(f.rating)}</div>
        </div>
        ${f.phone ? `<div class="bc-details"><div class="bc-detail"><label>PHONE</label>${escapeHtml(f.phone)}</div></div>` : ""}
        ${f.comment ? `<div class="bc-message">${escapeHtml(f.comment)}</div>` : ""}
      </div>
    `).join("");
  }
}

async function updateStatus(row, status, selectEl){
  selectEl.className = "bc-status-select status-" + status.toLowerCase();
  try{
    await fetch(WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "updateStatus", row, status })
    });
  } catch(err){
    console.log("Status update failed:", err);
  }
}

function formatDate(iso){
  if(!iso) return "";
  try{
    const d = new Date(iso);
    return d.toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch(e){ return iso; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
